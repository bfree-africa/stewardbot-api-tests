# This repository is public, so the org's required security workflows
# (which live in a private repository) can't run here. These are its own
# equivalent checks, required by this repository's ruleset; see
# SECURITY-EXCEPTIONS.md in bfree-africa/.github. Tool versions match the
# org's security baseline.
name: Security

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5  # v5.5.0
        with:
          go-version: ">=1.25.10"
          cache: false
      - name: Install gitleaks
        run: |
          set -euo pipefail
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          gitleaks version
      - name: Scan the whole history
        # The repository is small and public, so every commit is scanned,
        # not only a pull request's range. Every default rule runs, and
        # in-repo allow files and inline allow comments are not honoured.
        run: |
          set -euo pipefail
          gitleaks git --no-banner --redact --exit-code 1 --ignore-gitleaks-allow --gitleaks-ignore-path /dev/null .

  osv-scanner:
    name: OSV-Scanner
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5  # v5.5.0
        with:
          go-version: ">=1.25.10"
          cache: false
      - name: Install osv-scanner
        run: |
          set -euo pipefail
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.6.0
          osv-scanner --version
      - name: Scan dependencies
        # Exit 1 means vulnerabilities were found and fails the job. Exit
        # 128 means there's no lockfile to scan, which is fine while the
        # repository holds no dependencies; anything else is an error.
        # The runner's shell is `bash -e`, so the status is captured with
        # `|| status=$?` rather than read afterwards.
        run: |
          set -uo pipefail
          status=0
          osv-scanner scan source --recursive . || status=$?
          if [ "$status" -eq 128 ]; then
            echo "::notice::No dependency lockfile in this repository; nothing to scan."
            exit 0
          fi
          exit "$status"

  zizmor:
    name: zizmor (Actions workflow audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@5f14fd08f7cf1cb1609c1e344975f152c7ee938d  # v0.5.6
        # Blocking here, unlike the org baseline: customers run this
        # repository's Action in their own pipelines.
        with:
          inputs: .
          advanced-security: false
